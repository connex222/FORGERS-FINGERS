name: Bundle Creative Claw audio locally
on:
  push:
    branches: [fix/vendor-creativeclaw-audio]
    paths: ['CREATIVE-CLAW-AUDIO-SOURCES.json', 'tests/offline-audio.test.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node tools/vendor-creativeclaw-audio.mjs
      - run: npm ci && npm test
      - name: Commit MP3s and exact size report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f AUDIO_VENDOR_REPORT.json
          node --input-type=commonjs -e "for(const a of require('./CREATIVE-CLAW-AUDIO-SOURCES.json').assets)require('node:child_process').execFileSync('git',['add','-f',a.path])"
          if ! git diff --cached --quiet; then
            git commit -m 'assets: bundle Lord Gavelby, lobby and premium effects'
            git push
          fi
