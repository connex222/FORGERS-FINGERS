<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgers Finger — TV</title>
<link rel="icon" href="/assets/icon-192.png">
<style>
@font-face { font-family: 'FF Display'; src: url('/assets/fonts/display.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'FF Body'; src: url('/assets/fonts/body.woff2') format('woff2'); font-display: swap; }

:root {
  --wall: #1D2F4A; --wall-deep: #101B2E; --oxblood: #7A1F2B; --oxblood-hi: #A52C3B;
  --brass: #C9A245; --brass-hi: #F0D891; --paper: #F3EAD7; --ink: #1B1712;
  --good: #59C27A; --bad: #E2584F;
  --display: 'FF Display', 'Bodoni 72', Didot, 'Playfair Display', Georgia, serif;
  --body: 'FF Body', Alegreya, 'Iowan Old Style', Palatino, Georgia, serif;
}
body.after { --wall: #2A1230; --wall-deep: #16081A; --oxblood: #8E1F4E; --oxblood-hi: #C2306C; --brass: #D8A85A; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--body); color: var(--paper); }

#stage { position: absolute; width: 1920px; height: 1080px; left: 50%; top: 50%; transform-origin: center center; overflow: hidden; }

/* Background: the image sits on top of a gradient, so a missing file just shows the gradient */
#bg { position: absolute; inset: 0; background:
  url('/assets/bg-gallery.webp') center / cover no-repeat,
  radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--wall) 75%, #fff 10%) 0%, var(--wall) 45%, var(--wall-deep) 100%); }
body[data-phase="draw"] #bg, body[data-phase="intro"] #bg { background-image: url('/assets/bg-studio.webp'),
  radial-gradient(ellipse at 50% 35%, var(--wall) 0%, var(--wall-deep) 100%); }
body[data-phase="auction"] #bg, body[data-phase="reveal"] #bg { background-image: url('/assets/bg-auction.webp'),
  radial-gradient(ellipse at 50% 20%, var(--oxblood) 0%, var(--wall-deep) 70%); }
body[data-phase="final"] #bg { background-image: url('/assets/bg-final.webp'),
  radial-gradient(ellipse at 50% 30%, var(--oxblood) 0%, var(--wall-deep) 75%); }
body.after #bg { background-image: url('/assets/bg-afterhours.webp'),
  radial-gradient(ellipse at 50% 30%, var(--oxblood) 0%, var(--wall-deep) 75%); }
/* Dims the artwork so text stays readable on detailed backgrounds */
#bg::after { content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.25) 0%, rgba(0,0,0,.5) 100%),
              linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 30%, rgba(0,0,0,.3) 70%, rgba(0,0,0,.75) 100%); }
#view h1, #view h2, .tr-title, .tr-label, .v-lot, .v-q, .v-line, .nm, .lotno, .sub, .lobby-status, .next, #round {
  text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.7); }

/* ---------- Top bar ---------- */
#top { position: absolute; left: 60px; right: 60px; top: 24px; height: 90px; display: flex; align-items: center; gap: 28px; }
.logo { height: 90px; display: flex; align-items: center; position: relative; }
.logo img { height: 104px; width: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.logo .logo-text { font-family: var(--display); font-size: 54px; color: var(--brass-hi); letter-spacing: .5px;
  text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.logo.img-ok .logo-text { display: none; }
#round { margin-left: auto; font-family: var(--display); font-size: 34px; color: var(--paper); }
.chip { background: rgba(0,0,0,.45); border: 2px solid var(--brass); border-radius: 40px; padding: 8px 22px; font-size: 26px; }
.chip b { font-family: var(--display); letter-spacing: 4px; color: var(--brass-hi); }
#badge { position: relative; display: none; height: 70px; min-width: 70px; align-items: center; justify-content: center; }
body.after #badge { display: flex; }
#badge img { height: 70px; }
#badge .badge-text { background: var(--oxblood-hi); color: #fff; font-weight: 700; font-size: 28px; border-radius: 50%;
  width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--brass-hi); }
#badge.img-ok .badge-text { display: none; }
#soundBtn { background: transparent; color: var(--paper); border: 2px solid rgba(255,255,255,.4); border-radius: 40px;
  font: inherit; font-size: 22px; padding: 8px 18px; cursor: pointer; }

/* ---------- Main view area ---------- */
#view { position: absolute; left: 60px; right: 60px; top: 130px; bottom: 220px; }

/* ---------- Auctioneer host ---------- */
#host { position: absolute; left: 40px; bottom: 20px; display: flex; align-items: flex-end; gap: 20px; max-width: 1240px; }
.host-portrait { position: relative; width: 190px; height: 190px; flex: none; }
.host-portrait img { width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.6)); }
.host-portrait .host-fallback { position: absolute; inset: 20px; border-radius: 50%; background: var(--oxblood);
  border: 5px solid var(--brass); display: flex; align-items: center; justify-content: center; font-size: 90px; }
.host-portrait.img-ok .host-fallback { display: none; }
#quip { background: var(--paper); color: var(--ink); font-size: 30px; line-height: 1.3; padding: 18px 28px; border-radius: 18px;
  position: relative; margin-bottom: 40px; font-style: italic; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 980px; }
#quip::before { content: ''; position: absolute; left: -18px; bottom: 26px; border: 12px solid transparent;
  border-right: 18px solid var(--paper); border-left: 0; }
#quip .who { display: block; font-style: normal; font-size: 18px; color: var(--oxblood); font-weight: 700; margin-bottom: 4px; }
#quip:empty { display: none; }

/* ---------- Control button (mouse/keyboard users) ---------- */
#ctl { position: absolute; right: 60px; bottom: 50px; font: inherit; font-size: 28px; font-weight: 700; padding: 18px 36px;
  border-radius: 14px; border: 3px solid var(--brass-hi); background: var(--oxblood); color: #fff; cursor: pointer; }
#ctl:hover, #ctl:focus-visible { background: var(--oxblood-hi); outline: 4px solid var(--brass-hi); outline-offset: 3px; }
#ctl[hidden] { display: none; }

/* ---------- Avatars ---------- */
.av { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
  width: 96px; height: 96px; flex: none; overflow: hidden; border: 4px solid var(--brass); background: #555; }
.av b { font-family: var(--display); font-size: 48px; color: #fff; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.img-ok b { visibility: hidden; }
.av-1 { background: #8E3B46; } .av-2 { background: #2F6E8E; } .av-3 { background: #6E8E2F; } .av-4 { background: #8E6A2F; }
.av-5 { background: #5B3F8E; } .av-6 { background: #2F8E6A; } .av-7 { background: #8E2F7A; } .av-8 { background: #4A4A4A; }
.av.sm { width: 64px; height: 64px; border-width: 3px; } .av.sm b { font-size: 32px; }
.av.lg { width: 150px; height: 150px; border-width: 6px; } .av.lg b { font-size: 76px; }

/* ---------- Gilt frame ---------- */
.frame { position: relative; aspect-ratio: 900 / 1200; height: 100%; flex: none;
  background: linear-gradient(135deg, #7a5a18 0%, #e9cf84 22%, #a67c2a 45%, #f3dd98 68%, #7a5a18 100%);
  border-radius: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 0 0 6px rgba(0,0,0,.25); }
/* Window measured from frame-gilt.png: 10% in from the sides, 7.5% from top and bottom */
.frame-inner { position: absolute; left: 10%; right: 10%; top: 7.5%; bottom: 7.5%; background: var(--paper);
  box-shadow: inset 0 0 18px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
.frame-inner canvas { width: 100%; height: auto; aspect-ratio: 3 / 4; max-height: 100%; display: block; }
.frame > img.frame-img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.plaque { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); background: linear-gradient(#f3dd98, #b8902f);
  color: var(--ink); font-family: var(--display); font-size: 30px; padding: 4px 22px; border-radius: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,.5); white-space: nowrap; }
.stamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-14deg) scale(1); width: 92%;
  display: flex; align-items: center; justify-content: center; pointer-events: none; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; }
.stamp img { width: 100%; }
.stamp em { font-family: var(--display); font-style: normal; font-size: 64px; padding: 6px 22px; border: 8px solid currentColor;
  border-radius: 10px; background: rgba(243,234,215,.75); }
.stamp.img-ok em { display: none; }
.stamp.forgery em { color: #C8102E; }
.stamp.genuine em { color: #1F7A3A; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-14deg) scale(2.6); opacity: 0; } }
.frame.genuine { box-shadow: 0 0 0 6px var(--brass-hi), 0 0 70px 20px rgba(240,216,145,.55); }

/* ---------- Timer ---------- */
.timer { position: relative; width: 150px; height: 150px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 12; }
.timer .track { stroke: rgba(255,255,255,.18); }
.timer .bar { stroke: var(--brass-hi); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer.low .bar { stroke: var(--bad); }
.timer span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 58px; }

/* ---------- Lobby ---------- */
.lobby { display: grid; grid-template-columns: 760px 1fr; gap: 60px; height: 100%; }
.join-card { background: rgba(0,0,0,.5); border: 3px solid var(--brass); border-radius: 22px; padding: 34px 40px; }
.join-lead { font-size: 28px; opacity: .9; }
.join-url { font-family: var(--display); font-size: 50px; color: var(--brass-hi); margin: 2px 0 14px; word-break: break-all; }
.code { display: flex; gap: 14px; margin: 12px 0 22px; }
.code span { width: 120px; height: 140px; display: flex; align-items: center; justify-content: center; font-family: var(--display);
  font-size: 100px; color: var(--ink); background: var(--paper); border-radius: 12px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); }
.collection { display: inline-block; font-size: 26px; font-weight: 700; padding: 8px 20px; border-radius: 30px; background: #2E6B47; }
.collection.after { background: var(--oxblood-hi); }
.settings-line { font-size: 24px; margin: 12px 0 0; opacity: .9; }
.warn { margin-top: 14px; font-size: 24px; color: #FFD27A; font-weight: 700; }
.howto { list-style: none; margin-top: 22px; display: grid; gap: 10px; counter-reset: step; }
.howto li { counter-increment: step; font-size: 23px; line-height: 1.3; padding-left: 46px; position: relative; }
.howto li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%;
  background: var(--brass); color: var(--ink); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.wall-wrap { display: flex; flex-direction: column; }
.wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
.slot { backdrop-filter: blur(3px); height: 300px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: rgba(0,0,0,.4); border: 3px solid var(--brass); position: relative; }
.slot.new { animation: hang .5s cubic-bezier(.2,1.4,.4,1) both; }
.slot.empty { border: 3px dashed rgba(255,255,255,.3); background: rgba(0,0,0,.5); animation: none; }
.slot.empty span { font-size: 22px; opacity: .55; font-style: italic; }
.slot .av { width: 150px; height: 150px; } .slot .av b { font-size: 76px; }
.slot-name { font-size: 30px; font-weight: 700; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .tag { position: absolute; top: -16px; background: var(--brass); color: var(--ink); font-size: 18px; font-weight: 700; padding: 3px 12px; border-radius: 12px; }
.slot.gone { opacity: .45; }
@keyframes hang { from { transform: translateY(-30px) rotate(-3deg); opacity: 0; } }
.lobby-status { margin-top: 26px; font-size: 32px; font-family: var(--display); color: var(--brass-hi); }

/* ---------- Intro ---------- */
.intro { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
.intro .lotno { font-size: 34px; color: var(--brass-hi); font-family: var(--display); }
.intro h1 { font-family: var(--display); font-size: 92px; line-height: 1.05; font-weight: 400; }
.master-card { display: flex; align-items: center; gap: 30px; background: rgba(0,0,0,.5); border: 3px solid var(--brass);
  padding: 22px 46px; border-radius: 22px; text-align: left; }
.master-card .lab { font-size: 26px; opacity: .85; } .master-card .mname { font-family: var(--display); font-size: 64px; color: var(--brass-hi); }
.intro .sub { font-size: 32px; max-width: 1300px; line-height: 1.35; }

/* ---------- Draw ---------- */
.draw { height: 100%; display: grid; grid-template-columns: 1fr 200px; grid-template-rows: auto 1fr; gap: 30px 40px; }
.cat-plaque { background: linear-gradient(#f6ecd4, #e3d2a8); color: var(--ink); border-radius: 12px; padding: 30px 46px;
  border: 6px solid var(--brass); box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.cat-genre { font-size: 30px; color: var(--oxblood); font-style: italic; }
.cat-text { font-family: var(--display); font-size: 76px; line-height: 1.08; margin: 6px 0 14px; }
.cat-note { font-size: 26px; opacity: .8; }
.draw .timer { align-self: center; justify-self: center; }
.easels { grid-column: 1 / -1; display: flex; gap: 22px; flex-wrap: wrap; align-content: flex-start; }
.easel { width: 200px; background: rgba(0,0,0,.45); border-radius: 16px; padding: 18px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 10px; border: 3px solid transparent; }
.easel .name { font-size: 24px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.easel .st { font-size: 20px; opacity: .8; font-style: italic; }
.easel.done { border-color: var(--good); } .easel.done .st { color: var(--good); font-style: normal; font-weight: 700; opacity: 1; }
.easel.master .role { background: var(--brass); color: var(--ink); font-size: 17px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
.easel.gone { opacity: .4; }
.painting-anim .st::after { content: '…'; animation: dots 1.4s steps(3) infinite; display: inline-block; overflow: hidden; width: 0; vertical-align: bottom; }
@keyframes dots { to { width: 1.2em; } }

/* ---------- Auction ---------- */
.auction { height: 100%; display: flex; flex-direction: column; gap: 26px; }
.auction-head { display: flex; align-items: center; gap: 30px; }
.auction-head .tr { flex: 1; }
.tr-label { font-size: 28px; opacity: .85; }
.tr-title { font-family: var(--display); font-weight: 400; font-size: 70px; line-height: 1.05; color: var(--brass-hi); }
.tr-title.long { font-size: 54px; }
.auction-head .timer { width: 130px; height: 130px; } .auction-head .timer span { font-size: 48px; }
.bidders { display: flex; gap: 10px; flex-wrap: wrap; max-width: 380px; justify-content: flex-end; }
.bidder { position: relative; }
.bidder .paddle { position: absolute; right: -6px; bottom: -6px; background: var(--good); color: #fff; width: 30px; height: 30px; border-radius: 50%;
  font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
.bidder:not(.done) .av { filter: grayscale(.8) brightness(.6); }
.lots { flex: 1; display: flex; justify-content: center; align-content: center; flex-wrap: wrap; gap: 50px 46px; }
.lots .frame { height: 465px; }
.lots.two-rows { gap: 46px 50px; }
.lots.two-rows .frame { height: 300px; }
.lots.two-rows .plaque { font-size: 24px; bottom: -22px; }
.hanging { margin: auto; font-size: 40px; font-family: var(--display); }

/* ---------- Reveal ---------- */
.reveal { height: 100%; display: grid; grid-template-columns: 560px 1fr; gap: 70px; align-items: center; }
.reveal .spot { height: 640px; display: flex; justify-content: center; }
.v-lot { font-family: var(--display); font-size: 54px; color: var(--brass-hi); }
.v-q { font-family: var(--display); font-size: 90px; line-height: 1.02; margin: 4px 0 24px; }
.v-who { display: flex; align-items: center; gap: 24px; margin: 6px 0 22px; }
.v-who .nm { font-family: var(--display); font-size: 64px; line-height: 1; }
.v-line { font-size: 34px; line-height: 1.35; margin: 6px 0; }
.v-line .plus { color: var(--good); font-weight: 700; } .v-line .minus { color: var(--bad); font-weight: 700; }
.v-buyers { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 18px; }
.v-buyer { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.4); border-radius: 40px; padding: 6px 18px 6px 6px; font-size: 28px; }
.v-verdict { margin-top: 20px; font-size: 38px; font-family: var(--display); color: var(--brass-hi); line-height: 1.2; }
.fav { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
.fav h2 { font-family: var(--display); font-weight: 400; font-size: 76px; }
.fav .row { display: flex; gap: 60px; justify-content: center; flex: 1; align-items: center; }
.fav .pick { display: flex; flex-direction: column; align-items: center; gap: 40px; height: 100%; }
.fav .pick .frame { height: 440px; }
.fav .rosette { position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
.fav .rosette img { width: 100%; }
.fav .rosette em { font-style: normal; font-size: 80px; }
.fav .rosette.img-ok em { display: none; }
.fav .who { font-size: 34px; font-weight: 700; }
.fav .none { font-size: 40px; margin: auto; font-style: italic; }

/* ---------- Scores ---------- */
.scores { height: 100%; display: flex; flex-direction: column; gap: 20px; }
.scores h2 { font-family: var(--display); font-weight: 400; font-size: 68px; }
.ledger { display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 1300px; }
.ledger .row { display: grid; grid-template-columns: 50px 70px 1fr auto 140px; gap: 16px; align-items: center;
  background: rgba(0,0,0,.45); border-radius: 14px; padding: 4px 20px; animation: slide .5s cubic-bezier(.2,1.2,.4,1) both; }
.ledger .rank { font-family: var(--display); font-size: 40px; color: var(--brass-hi); }
.ledger .nm { font-size: 32px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ledger .sc { font-family: var(--display); font-size: 40px; }
.ledger .dl { font-size: 26px; font-weight: 700; min-width: 110px; text-align: right; }
.dl.up { color: var(--good); } .dl.down { color: var(--bad); } .dl.flat { opacity: .5; }
@keyframes slide { from { transform: translateX(-40px); opacity: 0; } }
.scores .next { font-size: 28px; opacity: .85; }

/* ---------- Final ---------- */
.final { height: 100%; display: grid; grid-template-columns: 1.15fr 1fr; gap: 50px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 26px; height: 520px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 240px; }
.pod .nm { font-size: 32px; font-weight: 700; } .pod .sc { font-size: 26px; color: var(--brass-hi); }
.pod .block { width: 100%; border-radius: 12px 12px 0 0; display: flex; align-items: flex-start; justify-content: center;
  font-family: var(--display); font-size: 80px; color: var(--ink); padding-top: 10px;
  background: linear-gradient(#f3dd98, #a67c2a); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.pod.p1 .block { height: 260px; } .pod.p2 .block { height: 190px; background: linear-gradient(#e8e8e8, #9a9a9a); }
.pod.p3 .block { height: 140px; background: linear-gradient(#e7b98a, #9a6232); }
.rest { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; font-size: 26px; }
.rest span { background: rgba(0,0,0,.4); border-radius: 30px; padding: 6px 16px; }
.awards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.award { background: rgba(0,0,0,.5); border: 2px solid var(--brass); border-radius: 14px; padding: 14px 18px; display: flex; gap: 14px; align-items: center; }
.award .medal { width: 70px; height: 70px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; font-size: 46px; }
.award .medal img { width: 70px; height: 70px; position: absolute; inset: 0; }
.award .medal.img-ok em { display: none; } .award .medal em { font-style: normal; }
.award .t { font-weight: 700; font-size: 24px; color: var(--brass-hi); } .award .d { font-size: 21px; line-height: 1.25; }
.gallery { display: flex; flex-direction: column; align-items: center; gap: 30px; }
.gallery h3 { font-family: var(--display); font-weight: 400; font-size: 44px; }
.gallery .frame { height: 560px; }
.gallery .cap { font-size: 30px; text-align: center; max-width: 700px; line-height: 1.3; margin-top: 10px; }
.gallery .cap i { color: var(--brass-hi); }

/* ---------- Void ---------- */
.void { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
.void h1 { font-family: var(--display); font-weight: 400; font-size: 100px; }
.void p { font-size: 38px; max-width: 1200px; line-height: 1.35; }

/* ---------- Toast & offline ---------- */
#toast { position: absolute; left: 50%; top: 140px; transform: translateX(-50%); background: var(--oxblood); border: 3px solid var(--brass-hi);
  padding: 16px 34px; border-radius: 14px; font-size: 30px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; }
#offline { position: absolute; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 60px; z-index: 30; text-align: center; padding: 100px; }
#offline[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-phase="lobby">
<div id="stage">
  <div id="bg"></div>
  <header id="top">
    <div class="logo" id="logo"><img src="/assets/logo.png" alt="Forgers Finger" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"><span class="logo-text">Forgers Finger</span></div>
    <div id="round"></div>
    <div class="chip" id="codeChip" hidden>Code <b id="codeChipText"></b></div>
    <div id="badge"><img src="/assets/badge-18.png" alt="Adults only" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"><span class="badge-text">18+</span></div>
    <button id="soundBtn" type="button">Turn sound on</button>
  </header>
  <main id="view"></main>
  <div id="host">
    <div class="host-portrait" id="hostPortrait"><img id="hostImg" src="/assets/auctioneer.png" alt="" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"><span class="host-fallback">🧐</span></div>
    <p id="quip"></p>
  </div>
  <button id="ctl" type="button" hidden></button>
  <div id="toast"></div>
  <div id="offline" hidden>Reconnecting to the gallery…</div>
</div>

<script src="/shared.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = FF.esc;
  const view = $('#view');
  const PHASE_MS = { intro: 6000, auction: 50000, scores: 30000, void: 7000 };

  let S = null, viewKey = '', lots = {}, lotList = [], lotsRound = -1;
  let revealStart = 0, revealShown = '', galleryIdx = 0, galleryTimer = null, lastTickSec = -1;
  let saved = null;
  const seen = new Set();
  try { saved = JSON.parse(sessionStorage.getItem('ff-tv') || 'null'); } catch { saved = null; }

  /* ---------- Fit the 1920×1080 stage to any screen ---------- */
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- Socket ---------- */
  const sock = FF.socket({
    open() {
      $('#offline').hidden = true;
      if (saved && saved.code) sock.send({ t: 'tv_resume', code: saved.code, token: saved.token });
      else sock.send({ t: 'tv_create' });
    },
    close() { $('#offline').hidden = false; },
    message(m) {
      switch (m.t) {
        case 'tv_ok':
          saved = { code: m.code, token: m.token };
          try { sessionStorage.setItem('ff-tv', JSON.stringify(saved)); } catch { /* ignore */ }
          break;
        case 'state': onState(m); break;
        case 'lots':
          lotList = m.lots; lotsRound = m.round;
          lots = Object.fromEntries(m.lots.map(l => [l.letter, l]));
          if (S) { viewKey = keyFor(S); build(); }
          break;
        case 'sfx': FF.sfx(m.name); break;
        case 'toast': toast(m.msg); break;
      }
    },
  });

  /* ---------- Sound ---------- */
  $('#soundBtn').addEventListener('click', () => {
    FF.soundOn = !FF.soundOn;
    $('#soundBtn').textContent = FF.soundOn ? 'Sound on' : 'Turn sound on';
    if (FF.soundOn && S) music(S.phase); else { FF.stopSfx('music-lobby'); FF.stopSfx('music-draw'); }
  });
  function music(phase) {
    if (phase === 'lobby') FF.sfx('music-lobby', { loop: true, volume: 0.35 }); else FF.stopSfx('music-lobby');
    if (phase === 'draw') FF.sfx('music-draw', { loop: true, volume: 0.3 }); else FF.stopSfx('music-draw');
  }
  function phaseSound(phase) {
    music(phase);
    const cue = { intro: 'gavel', auction: 'gavel', scores: 'coins', final: 'fanfare', void: 'sad-trombone' }[phase];
    if (cue) FF.sfx(cue);
  }

  /* ---------- Controls ---------- */
  $('#ctl').addEventListener('click', () => {
    const cmd = $('#ctl').dataset.cmd;
    if (cmd) sock.send({ t: 'tv_cmd', cmd });
  });
  addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body && !$('#ctl').hidden) {
      e.preventDefault(); $('#ctl').click();
    }
  });
  const CTL = {
    lobby: ['Start game', 'start'], draw: ['End painting', 'skip'], auction: ['Close bidding', 'skip'],
    reveal: ['Skip to scores', 'next'], scores: ['Next lot', 'next'], void: ['Next lot', 'next'], final: ['Back to lobby', 'next'],
  };

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 4000);
  }

  /* ---------- Helpers ---------- */
  // Swap the auctioneer's pose only if that image file exists
  function setHost(name) {
    const probe = new Image();
    probe.onload = () => { const el = $('#hostImg'); if (el) el.src = probe.src; };
    probe.src = `/assets/${name}.png`;
  }
  const player = id => (S.players.find(p => p.id === id) || { name: 'Someone', avatar: 8 });
  const isAdult = () => S.settings.deck === 'adult';
  function frameHTML(letter, extra) {
    return `<figure class="frame ${extra || ''}" data-frame="${letter}">
      <div class="frame-inner"><canvas data-lot="${letter}"></canvas></div>
      <img class="frame-img" src="/assets/frame-gilt.png" alt="" onerror="this.remove()">
      <figcaption class="plaque">Lot ${letter}</figcaption>
    </figure>`;
  }
  function stampHTML(genuine) {
    const name = genuine ? 'genuine' : 'forgery';
    return `<span class="stamp ${name}"><em>${genuine ? 'Genuine' : 'Forgery!'}</em>` +
      `<img src="/assets/stamp-${name}.png" alt="" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"></span>`;
  }
  function timerHTML() {
    return `<div class="timer" data-timer-ring><svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="70"/>
      <circle class="bar" cx="80" cy="80" r="70" stroke-dasharray="439.8" stroke-dashoffset="0"/></svg><span data-timer></span></div>`;
  }
  function splitCatalogue(cat) {
    const i = cat.indexOf(' — ');
    return i > 0 ? [cat.slice(0, i), cat.slice(i + 3)] : ['', cat];
  }

  /* ---------- State ---------- */
  function keyFor(s) {
    if (s.phase === 'lobby') return 'lobby';
    if (['auction', 'reveal', 'scores'].includes(s.phase)) return `${s.phase}:${s.round}:${lotsRound === s.round}`;
    return `${s.phase}:${s.round}`;
  }

  function onState(s) {
    const prev = S ? S.phase : '';
    S = s;
    FF.setTimeLeft(s.timeLeft);
    document.body.classList.toggle('after', isAdult());
    document.body.dataset.phase = s.phase;
    chrome();
    const key = keyFor(s);
    if (key !== viewKey || s.phase === 'lobby') {
      const changed = key !== viewKey;
      viewKey = key;
      build();
      if (changed && s.phase !== prev) phaseSound(s.phase);
    } else update();
  }

  function chrome() {
    const inGame = S.phase !== 'lobby' && S.phase !== 'final' && S.totalRounds;
    $('#round').textContent = inGame ? `Lot ${S.round} of ${S.totalRounds}` : '';
    $('#codeChip').hidden = S.phase === 'lobby';
    $('#codeChipText').textContent = S.code;
    $('#quip').innerHTML = S.quip ? `<span class="who">Lord Gavelby, auctioneer</span>${esc(S.quip)}` : '';
    const c = CTL[S.phase];
    $('#ctl').hidden = !c;
    if (c) { $('#ctl').textContent = c[0]; $('#ctl').dataset.cmd = c[1]; }
  }

  function build() {
    clearInterval(galleryTimer); galleryTimer = null;
    revealShown = '';
    if (S.phase !== 'reveal') setHost('auctioneer');
    const r = { lobby, intro, draw, auction, reveal, scores, final, void: voided }[S.phase];
    if (r) r();
  }
  function update() {
    if (S.phase === 'draw') renderEasels();
    if (S.phase === 'auction') renderBidders();
  }

  /* ---------- Lobby ---------- */
  function lobby() {
    const ps = S.players;
    const slots = Array.from({ length: S.max }, (_, i) => {
      const p = ps[i];
      if (!p) return `<div class="slot empty"><span>Empty wall space</span></div>`;
      const fresh = !seen.has(p.id); seen.add(p.id);
      return `<div class="slot ${p.connected ? '' : 'gone'} ${fresh ? 'new' : ''}">${p.isVip ? '<span class="tag">Head Curator</span>' : ''}
        ${FF.avatar(p.avatar, p.name)}<span class="slot-name">${esc(p.name)}</span></div>`;
    }).join('');
    const vip = ps.find(p => p.isVip);
    let status;
    if (ps.length < S.min) status = `Waiting for at least ${S.min} players. ${ps.length} in the gallery so far.`;
    else if (isAdult() && !S.adultConfirmed) status = `${esc(vip ? vip.name : 'The Head Curator')} needs to confirm everyone is 18 or over.`;
    else status = `Ready when you are. ${esc(vip ? vip.name : 'The Head Curator')} presses Start on their phone.`;
    view.innerHTML = `<section class="lobby">
      <div class="join-card">
        <p class="join-lead">On your phone, go to</p>
        <p class="join-url">${esc(location.host)}</p>
        <p class="join-lead">and enter the gallery code</p>
        <div class="code">${S.code.split('').map(c => `<span>${c}</span>`).join('')}</div>
        <span class="collection ${isAdult() ? 'after' : ''}">${isAdult() ? 'After Hours Collection, adults only' : 'Family Collection'}</span>
        <p class="settings-line">${S.settings.drawTime} seconds to paint. Everyone is the Master ${S.settings.laps === 1 ? 'once' : 'twice'}.</p>
        <ol class="howto">
          <li><b>The Master</b> secretly gets the true title of a lost masterpiece.</li>
          <li><b>Everyone else</b> only sees a vague catalogue entry, and paints a forgery anyway.</li>
          <li><b>Bid guineas</b> on the painting you think is the genuine one.</li>
          <li><b>Fool buyers</b> to pocket their money. The Master only scores if some, but not all, spot theirs.</li>
        </ol>
      </div>
      <div class="wall-wrap">
        <div class="wall">${slots}</div>
        <p class="lobby-status">${status}</p>
      </div>
    </section>`;
  }

  /* ---------- Intro ---------- */
  function intro() {
    const m = player(S.masterId);
    view.innerHTML = `<section class="intro">
      <p class="lotno">Lot ${S.round} of ${S.totalRounds}</p>
      <h1>A lost masterpiece has surfaced</h1>
      <div class="master-card">${FF.avatar(m.avatar, m.name, 'lg')}
        <div><p class="lab">The Master this round</p><p class="mname">${esc(m.name)}</p></div></div>
      <p class="sub">Only ${esc(m.name)} knows the true title. Everyone else gets a vague catalogue entry. Paint something that fits, and act natural.</p>
    </section>`;
  }

  /* ---------- Draw ---------- */
  function draw() {
    const [genre, text] = splitCatalogue(S.catalogue || '');
    view.innerHTML = `<section class="draw">
      <div class="cat-plaque">
        ${genre ? `<p class="cat-genre">${esc(genre)}</p>` : ''}
        <p class="cat-text">${esc(text)}</p>
        <p class="cat-note">This is all the forgers know. Only the Master has the true title.</p>
      </div>
      ${timerHTML()}
      <div class="easels" id="easels"></div>
    </section>`;
    renderEasels();
  }
  function renderEasels() {
    const el = $('#easels'); if (!el) return;
    el.innerHTML = S.players.map(p => {
      const master = p.id === S.masterId;
      const cls = ['easel', p.submitted ? 'done' : 'painting-anim', master ? 'master' : '', p.connected ? '' : 'gone'].join(' ');
      return `<div class="${cls}">${FF.avatar(p.avatar, p.name)}<span class="name">${esc(p.name)}</span>
        ${master ? '<span class="role">Master</span>' : ''}<span class="st">${p.submitted ? 'Signed' : p.connected ? 'Painting' : 'Away'}</span></div>`;
    }).join('');
  }

  /* ---------- Auction ---------- */
  function auction() {
    if (lotsRound !== S.round) {
      view.innerHTML = `<section class="auction"><p class="hanging">Hanging the paintings…</p></section>`;
      return;
    }
    const two = lotList.length > 4;
    view.innerHTML = `<section class="auction">
      <div class="auction-head">
        <div class="tr"><p class="tr-label">The genuine painting is titled</p><h1 class="tr-title ${S.title.length > 48 ? 'long' : ''}">“${esc(S.title)}”</h1></div>
        <div class="bidders" id="bidders"></div>
        ${timerHTML()}
      </div>
      <div class="lots ${two ? 'two-rows' : ''}">${lotList.map(l => frameHTML(l.letter)).join('')}</div>
    </section>`;
    renderBidders();
    FF.paintAll(view, lots);
  }
  function renderBidders() {
    const el = $('#bidders'); if (!el) return;
    el.innerHTML = S.players.filter(p => p.id !== S.masterId).map(p =>
      `<span class="bidder ${p.bid ? 'done' : ''}" title="${esc(p.name)}">${FF.avatar(p.avatar, p.name, 'sm')}${p.bid ? '<span class="paddle">✓</span>' : ''}</span>`
    ).join('');
  }

  /* ---------- Reveal ---------- */
  function revealOrder() {
    const r = S.results;
    const forg = r.lots.filter(l => !l.genuine).sort((a, b) => a.buyers.length - b.buyers.length);
    return forg.concat(r.lots.filter(l => l.genuine));
  }
  function reveal() {
    if (!S.results) return;
    const steps = revealOrder().length;
    const total = steps * S.results.stepMs + S.results.tailMs;
    revealStart = Date.now() - Math.max(0, total - S.timeLeft);
    view.innerHTML = `<section id="revealRoot" style="height:100%"></section>`;
    revealTick();
  }
  function revealTick() {
    if (!S || S.phase !== 'reveal' || !S.results || lotsRound !== S.round) return;
    const r = S.results, order = revealOrder();
    const elapsed = Date.now() - revealStart;
    const step = Math.floor(elapsed / r.stepMs);
    const sub = (elapsed % r.stepMs) > 1600 ? 1 : 0;
    const key = step >= order.length ? 'tail' : `${step}:${sub}`;
    if (key === revealShown) return;
    revealShown = key;
    const root = $('#revealRoot'); if (!root) return;

    if (key === 'tail') { renderFavourite(root); FF.sfx('applause'); return; }
    const lot = order[step];
    const owner = player(lot.ownerId);
    const buyerChips = lot.buyers.map(b => {
      const p = player(b.id);
      return `<span class="v-buyer">${FF.avatar(p.avatar, p.name, 'sm')}${esc(p.name)}, ${FF.money(b.amount)}</span>`;
    }).join('');
    let info;
    if (!sub) {
      info = `<p class="v-lot">Lot ${lot.letter}</p><p class="v-q">Genuine, or forgery?</p>
        ${lot.buyers.length ? `<p class="v-line">Bought by</p><div class="v-buyers">${buyerChips}</div>` : `<p class="v-line">Nobody bid on this one.</p>`}`;
    } else if (!lot.genuine) {
      const take = lot.buyers.reduce((n, b) => n + b.amount, 0);
      info = `<p class="v-lot">Lot ${lot.letter}</p>
        <div class="v-who">${FF.avatar(owner.avatar, owner.name, 'lg')}<div><p class="v-line">A forgery by</p><p class="nm">${esc(owner.name)}</p></div></div>
        ${lot.buyers.length
          ? `<div class="v-buyers">${buyerChips}</div><p class="v-line">${esc(owner.name)} pockets <span class="plus">${FF.money(take)}</span> from the gullible.</p>`
          : `<p class="v-line">Nobody fell for it. Back to art school, ${esc(owner.name)}.</p>`}`;
    } else {
      const v = {
        perfect: `${r.correct} sharp-eyed ${r.correct === 1 ? 'collector' : 'collectors'} found it. ${esc(owner.name)} earns ${FF.money(r.masterEarned)}.`,
        obvious: `Everyone spotted it. Far too obvious, ${esc(owner.name)}. No fee for you.`,
        obscure: `Nobody spotted it. Far too obscure, ${esc(owner.name)}. No fee for you.`,
        nobids: 'Nobody bid at all. The auction house weeps quietly.',
      }[r.verdict];
      info = `<p class="v-lot">Lot ${lot.letter}</p>
        <div class="v-who">${FF.avatar(owner.avatar, owner.name, 'lg')}<div><p class="v-line">The genuine article, by</p><p class="nm">${esc(owner.name)}</p></div></div>
        ${lot.buyers.length ? `<div class="v-buyers">${buyerChips}</div><p class="v-line">Every buyer gets their bid back in profit.</p>` : ''}
        <p class="v-verdict">${v}</p>`;
    }
    root.innerHTML = `<div class="reveal">
      <div class="spot">${frameHTML(lot.letter, sub && lot.genuine ? 'genuine' : '')}</div>
      <div class="verdict">${info}</div></div>`;
    if (sub) {
      root.querySelector('.frame').insertAdjacentHTML('beforeend', stampHTML(lot.genuine));
      FF.sfx(lot.genuine ? 'stamp-genuine' : 'stamp-forgery');
      setHost(!lot.genuine && lot.buyers.length > 0 ? 'auctioneer-shock' : 'auctioneer');
    } else FF.sfx('drumroll');
    FF.paintAll(root, lots);
  }
  function renderFavourite(root) {
    const r = S.results;
    setHost('auctioneer');
    const winners = r.lots.filter(l => r.heartWinners.includes(l.letter));
    const master = player(r.masterId);
    const body = winners.length ? `<div class="row">${winners.map(l => {
      const p = player(l.ownerId);
      return `<div class="pick"><div style="position:relative;height:440px">${frameHTML(l.letter)}
        <span class="rosette"><em>🏵️</em><img src="/assets/rosette.png" alt="" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"></span></div>
        <p class="who">${esc(p.name)}, ${l.hearts} ${l.hearts === 1 ? 'admirer' : 'admirers'}, <span style="color:var(--good)">+100 gns</span></p></div>`;
    }).join('')}</div>` : `<p class="none">Nobody handed out a rosette this round. Tough crowd.</p>`;
    root.innerHTML = `<div class="fav"><h2>People’s Favourite</h2>${body}
      <p class="v-line">The true title was <i style="color:var(--brass-hi)">“${esc(S.title)}”</i>, by ${esc(master.name)}.</p></div>`;
    FF.paintAll(root, lots);
  }

  /* ---------- Scores ---------- */
  function scores() {
    const r = S.results || { deltas: {} };
    const ranked = [...S.players].sort((a, b) => b.score - a.score);
    const last = S.round >= S.totalRounds;
    view.innerHTML = `<section class="scores">
      <h2>The ledger</h2>
      <div class="ledger">${ranked.map((p, i) => {
        const d = r.deltas[p.id] || 0;
        return `<div class="row" style="animation-delay:${i * 80}ms"><span class="rank">${i + 1}</span>${FF.avatar(p.avatar, p.name, 'sm')}
          <span class="nm">${esc(p.name)}</span><span class="sc">${FF.money(p.score)}</span>
          <span class="dl ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${FF.signed(d)}</span></div>`;
      }).join('')}</div>
      <p class="next">${last ? 'The final reckoning' : 'Next lot'} in <span data-timer></span> seconds.</p>
    </section>`;
  }

  /* ---------- Void ---------- */
  function voided() {
    const m = player(S.masterId);
    const why = S.voided === 'master'
      ? `${esc(m.name)}’s genuine painting never arrived. Rumour has it they fled to Belgium.`
      : 'Not enough paintings arrived to hold an auction.';
    view.innerHTML = `<section class="void"><h1>Lot withdrawn</h1><p>${why}</p><p>On to the next lot.</p></section>`;
  }

  /* ---------- Final ---------- */
  function final() {
    const f = S.final;
    if (!f) return;
    const byId = id => player(id);
    const top = f.ranking.slice(0, 3);
    const podOrder = [top[1], top[0], top[2]].filter(Boolean);
    const place = r => f.ranking.indexOf(r) + 1;
    const AW = {
      forger: ['Master Forger', '🖌️', v => `Pocketed ${FF.money(v)} from the gullible.`],
      gullible: ['Most Generous Collector', '💸', v => `Spent ${FF.money(v)} on fakes.`],
      favourite: ['People’s Favourite', '🏵️', v => `Won ${v} ${v === 1 ? 'rosette' : 'rosettes'}.`],
      eagle: ['Eagle Eye', '🔍', v => `Spotted ${v} genuine ${v === 1 ? 'work' : 'works'}.`],
    };
    view.innerHTML = `<section class="final">
      <div>
        <div class="podium">${podOrder.map(r => {
          const p = byId(r.id), n = place(r);
          return `<div class="pod p${n}">${FF.avatar(p.avatar, p.name, n === 1 ? 'lg' : '')}<span class="nm">${esc(p.name)}</span>
            <span class="sc">${FF.money(r.score)}</span><div class="block">${n}</div></div>`;
        }).join('')}</div>
        ${f.ranking.length > 3 ? `<div class="rest">${f.ranking.slice(3).map((r, i) => `<span>${i + 4}. ${esc(byId(r.id).name)}, ${FF.money(r.score)}</span>`).join('')}</div>` : ''}
        <div class="awards">${f.awards.map(a => {
          const [t, icon, d] = AW[a.key]; const p = byId(a.id);
          return `<div class="award"><span class="medal"><em>${icon}</em><img src="/assets/award-${a.key}.png" alt="" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"></span>
            <div><p class="t">${t}: ${esc(p.name)}</p><p class="d">${d(a.value)}</p></div></div>`;
        }).join('')}</div>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>`;
    galleryIdx = 0;
    showGallery();
    if (f.gallery.length > 1) galleryTimer = setInterval(showGallery, 6000);
  }
  function showGallery() {
    const g = S.final && S.final.gallery;
    const el = $('#gallery'); if (!el || !g || !g.length) return;
    const item = g[galleryIdx % g.length]; galleryIdx++;
    el.innerHTML = `<h3>Tonight’s genuine masterpieces</h3>
      <figure class="frame" style="height:560px"><div class="frame-inner"><canvas id="galCanvas"></canvas></div>
        <img class="frame-img" src="/assets/frame-gilt.png" alt="" onerror="this.remove()"></figure>
      <p class="cap"><i>“${esc(item.title)}”</i><br>by ${esc(item.masterName)}</p>`;
    requestAnimationFrame(() => FF.paint($('#galCanvas'), item.strokes));
  }

  /* ---------- Clock: timers, ticks and the reveal sequence ---------- */
  setInterval(() => {
    if (!S) return;
    const sec = FF.secondsLeft();
    document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = sec; });
    const ring = document.querySelector('[data-timer-ring]');
    if (ring) {
      const total = S.phase === 'draw' ? S.settings.drawTime * 1000 : (PHASE_MS[S.phase] || 60000);
      const left = Math.max(0, FF.deadline - Date.now());
      ring.querySelector('.bar').style.strokeDashoffset = (439.8 * (1 - Math.min(1, left / total))).toFixed(1);
      ring.classList.toggle('low', sec <= 10);
    }
    if ((S.phase === 'draw' || S.phase === 'auction') && sec !== lastTickSec) {
      lastTickSec = sec;
      if (sec > 0 && sec <= 5) FF.sfx('tick');
    }
    if (S.phase === 'reveal') revealTick();
  }, 200);
})();
</script>
</body>
