<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#14213A">
<title>Forgers Finger</title>
<script>
// The unqualified public address opens the TV gallery on desktop, rather than
// silently showing the controller-only join form with no QR. Phone join URLs
// with ?code= or ?player=1 always stay on this page.
(() => {
  const q = new URLSearchParams(location.search);
  const incoming = q.has('code') || q.has('player') || q.has('join');
  let isReturningPlayer = false;
  try { const p = JSON.parse(localStorage.getItem('ff-player') || 'null');
    isReturningPlayer = !!(p && p.pid && p.resumeToken && p.code); } catch { /* no prior session */ }
  if (!incoming && !isReturningPlayer && matchMedia('(min-width: 1000px) and (pointer: fine)').matches)
    location.replace('/tv');
})();
</script>

<style>
@font-face { font-family: 'FF Display'; src: url('/assets/fonts/display.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'FF Body'; src: url('/assets/fonts/body.woff2') format('woff2'); font-display: swap; }

:root {
  --bg: #F7F4EC; --panel: #FFFFFF; --ink: #14213A; --muted: #4A5568; --line: #CFC6B2;
  --accent: #8E2433; --accent-ink: #FFFFFF; --brass: #8A6A12; --good: #1E7A3C; --bad: #B3261E;
  --sel: #C9A245;
  --display: 'FF Display', 'Bodoni 72', Didot, 'Playfair Display', Georgia, serif;
  --body: 'FF Body', Alegreya, 'Iowan Old Style', Palatino, Georgia, serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1A2C; --panel: #18263D; --ink: #F4EEDF; --muted: #B8C0CC; --line: #33445F;
    --accent: #C24152; --brass: #E2C26E; --good: #5BD17F; --bad: #FF7A70; --sel: #E2C26E; }
}
body.after { --accent: #A3245E; }
@media (prefers-color-scheme: dark) { body.after { --accent: #D2407F; } }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.4;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
#app { height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Common ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 2px solid var(--line); background: var(--panel); flex: none; }
.bar .role { font-weight: 700; font-size: 16px; padding: 4px 12px; border-radius: 20px; background: var(--ink); color: var(--bg); }
.bar .role.master { background: var(--accent); color: var(--accent-ink); }
.bar .me { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.bar .me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .clock { margin-left: auto; font-family: var(--display); font-size: 30px; min-width: 56px; text-align: right; }
.bar .clock.low { color: var(--bad); }
.body { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.foot { flex: none; padding: 10px 14px calc(12px + var(--safe-b)); background: var(--panel); border-top: 2px solid var(--line);
  display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1.1; }
h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; }
.lead { font-size: 19px; color: var(--muted); }
.center { text-align: center; align-items: center; justify-content: center; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.card.secret { border-color: var(--accent); border-width: 3px; }
.small { font-size: 15px; color: var(--muted); }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { min-height: 56px; border-radius: 14px; border: 0; font-size: 20px; font-weight: 700; padding: 0 18px;
  background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn:disabled { opacity: .4; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.quiet { background: transparent; color: var(--muted); min-height: 44px; font-size: 17px; font-weight: 400; text-decoration: underline; }
.btn:focus-visible, .seg button:focus-visible, .tool:focus-visible, .sw:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
input { font: inherit; font-size: 22px; width: 100%; min-height: 56px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 0 14px; -webkit-user-select: text; user-select: text; }
input:focus { outline: 3px solid var(--sel); border-color: transparent; }
input.code-in { font-family: var(--display); font-size: 40px; letter-spacing: 14px; text-transform: uppercase; text-align: center; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
.err { color: var(--bad); font-weight: 700; min-height: 24px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; border: 2px solid var(--line); }
.seg button { min-height: 46px; border: 0; border-radius: 9px; background: transparent; font-size: 17px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field + .field { margin-top: 14px; }

/* ---------- Avatars ---------- */
.av { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
  width: 40px; height: 40px; flex: none; overflow: hidden; border: 2px solid var(--sel); background: #555; }
.av b { font-family: var(--display); font-size: 20px; color: #fff; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.img-ok b { visibility: hidden; }
.av.lg { width: 130px; height: 130px; border-width: 4px; } .av.lg b { font-size: 64px; }
.av-1 { background: #8E3B46; } .av-2 { background: #2F6E8E; } .av-3 { background: #6E8E2F; } .av-4 { background: #8E6A2F; }
.av-5 { background: #5B3F8E; } .av-6 { background: #2F8E6A; } .av-7 { background: #8E2F7A; } .av-8 { background: #4A4A4A; }

/* ---------- Join ---------- */
.brand { display: flex; justify-content: center; position: relative; min-height: 90px; align-items: center; }
.brand img { max-width: 80%; max-height: 120px; }
.brand .brand-text { font-family: var(--display); font-size: 44px; color: var(--accent); }
.brand.img-ok .brand-text { display: none; }

/* ---------- Draw ---------- */
.prompt { padding: 8px 14px; background: var(--panel); border-bottom: 2px solid var(--line); flex: none; }
.prompt .k { font-size: 14px; color: var(--muted); }
.prompt .v { font-family: var(--display); font-size: 21px; line-height: 1.15; }
.prompt.master { background: var(--accent); color: var(--accent-ink); }
.prompt.master .k { color: inherit; opacity: .85; }
.easel { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
.canvas-box { position: relative; border-radius: 4px; box-shadow: 0 0 0 4px var(--sel), 0 8px 20px rgba(0,0,0,.35); background: #F3EAD7; }
.canvas-box canvas { width: 100%; height: 100%; display: block; touch-action: none; border-radius: 4px; }
.tools { flex: none; padding: 8px 10px calc(8px + var(--safe-b)); background: var(--panel); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.palette { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sw { height: 38px; border-radius: 10px; border: 2px solid rgba(0,0,0,.3); position: relative; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--ink); }
.sw.rubber { background: repeating-linear-gradient(45deg, #F3EAD7 0 6px, #ddd2ba 6px 12px) !important; font-size: 11px; font-weight: 700; color: #333; }
.row { display: flex; gap: 6px; align-items: stretch; }
.tool { flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 4px; }
.tool[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.tool .dot { background: currentColor; border-radius: 50%; display: inline-block; }
.tool.warn { color: var(--bad); }
.sizes { display: flex; gap: 6px; flex: 1.4; }

/* ---------- Auction ---------- */
.title-card { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; }
.title-card .k { font-size: 14px; opacity: .8; } .title-card .v { font-family: var(--display); font-size: 24px; line-height: 1.15; }
.lots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lot { position: relative; border-radius: 10px; border: 3px solid transparent; padding: 0; background: none; text-align: left; }
.lot canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 7px; background: #F3EAD7; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.lot .letter { position: absolute; left: 6px; top: 6px; background: var(--ink); color: var(--bg); font-family: var(--display);
  font-size: 22px; min-width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.lot.sel { border-color: var(--sel); box-shadow: 0 0 0 3px var(--accent); }
.lot.sel::after { content: 'Buying'; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: var(--accent); color: #fff;
  font-weight: 700; font-size: 15px; padding: 3px 12px; border-radius: 12px; }
.lot.mine canvas { opacity: .45; }
.lot.mine::after { content: 'Yours'; position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); background: var(--ink); color: var(--bg);
  font-weight: 700; padding: 4px 14px; border-radius: 12px; }
.heart { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25);
  background: rgba(255,255,255,.9); font-size: 22px; display: flex; align-items: center; justify-content: center; color: #8E2433; }
.heart[aria-pressed="true"] { background: #C8102E; color: #fff; border-color: #fff; }
.amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.amounts button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-weight: 700; font-size: 18px; }
.amounts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Results ---------- */
.big-num { font-family: var(--display); font-size: 54px; line-height: 1; }
.delta { font-size: 26px; font-weight: 700; } .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.preview { width: 60%; max-width: 240px; aspect-ratio: 3/4; margin: 0 auto; box-shadow: 0 0 0 4px var(--sel); border-radius: 4px; }
.preview canvas { width: 100%; height: 100%; display: block; }
.adult-card { border-color: var(--accent); border-width: 3px; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; }

#toast { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg);
  padding: 14px 16px; border-radius: 12px; font-weight: 700; transform: translateY(-160%); transition: transform .25s; z-index: 10; }
#toast.show { transform: none; }
#net { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bad); color: #fff; text-align: center; font-weight: 700;
  padding: 8px calc(8px + var(--safe-b)); z-index: 9; }
#net[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="net" hidden>Reconnecting…</div>
<button id="phoneAudio" type="button" aria-label="Audio settings" style="position:fixed;left:8px;top:calc(7px + env(safe-area-inset-top, 0px));z-index:8;padding:5px 9px;border:1px solid #aa914f;border-radius:8px;background:#f7f4ec;color:#14213a;font-size:13px">Sound off</button>
<div id="phoneAudioPanel" role="group" aria-label="Audio controls" hidden style="position:fixed;left:8px;top:calc(43px + env(safe-area-inset-top, 0px));z-index:10;background:#241a12;color:#fff4d3;border:2px solid #b79548;border-radius:9px;padding:12px;font:15px/1.7 system-ui,sans-serif;box-shadow:0 5px 20px #000b">
 <label style="display:block"><input type="checkbox" data-phone-audio="enabled"> Sound enabled</label>
 <label style="display:block"><input type="checkbox" data-phone-audio="music"> Music</label>
 <label style="display:block"><input type="checkbox" data-phone-audio="effects"> Effects</label>
 <label style="display:block"><input type="checkbox" data-phone-audio="voice"> Tutorial voice</label>
 <button type="button" id="phoneAudioClose" style="padding:5px 12px">Close</button>
</div>
<button id="phoneHow" type="button" aria-label="How to Play" style="position:fixed;right:8px;top:calc(7px + env(safe-area-inset-top, 0px));z-index:8;padding:5px 9px;border:1px solid #aa914f;border-radius:8px;background:#f7f4ec;color:#14213a;font-size:13px">How to Play</button>

<script src="/shared.js"></script>
<script src="/tutorial.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = FF.esc;
  $('#phoneHow').addEventListener('click', FF.showRules);
  // Phones are silent by default until their owner enables sound.
  try { if (!localStorage.getItem('ff-audio')) { FF.audio.music = false; FF.saveAudio(); } } catch {}
  function updatePhoneAudio() {
    $('#phoneAudio').textContent = FF.audio.enabled ? 'Sound on' : 'Sound off';
    document.querySelectorAll('[data-phone-audio]').forEach(el => el.checked = !!FF.audio[el.dataset.phoneAudio]);
  }
  $('#phoneAudio').addEventListener('click', () => {
    const panel = $('#phoneAudioPanel'); panel.hidden = !panel.hidden; updatePhoneAudio();
  });
  $('#phoneAudioClose').addEventListener('click', () => { $('#phoneAudioPanel').hidden = true; $('#phoneAudio').focus(); });
  document.querySelectorAll('[data-phone-audio]').forEach(el => el.addEventListener('change', () => {
    FF.audio[el.dataset.phoneAudio] = el.checked; FF.saveAudio();
    FF.music(S && S.phase, 0.12); updatePhoneAudio();
  }));
  updatePhoneAudio();

  let S = null, key = '', joined = false;
  let lots = {}, lotList = [], lotsRound = -1;
  let me = load();
  const auc = { round: -1, sel: null, amount: 2, heart: null };
  let pendingDrawing = null, lastPhase = '';
  try { pendingDrawing = JSON.parse(sessionStorage.getItem('ff-pending-drawing') || 'null'); } catch { pendingDrawing = null; }
  function keepPending() {
    try {
      if (pendingDrawing) sessionStorage.setItem('ff-pending-drawing', JSON.stringify(pendingDrawing));
      else sessionStorage.removeItem('ff-pending-drawing');
    } catch { /* storage unavailable */ }
  }
  function clearSession() { me.pid = null; me.resumeToken = null; save(); }
  function sendPending() {
    if (pendingDrawing && S && S.phase === 'draw' && pendingDrawing.round === S.round && S.you && !S.you.submitted)
      sock.send({ t: 'drawing', ...pendingDrawing });
  }

  function load() { try { return JSON.parse(localStorage.getItem('ff-player') || '{}'); } catch { return {}; } }
  function save() { try { localStorage.setItem('ff-player', JSON.stringify(me)); } catch { /* ignore */ } }

  const qsCode = new URLSearchParams(location.search).get('code');
  if (qsCode && /^[A-HJ-NP-Z]{4}$/i.test(qsCode) && qsCode.toUpperCase() !== me.code) {
    me.code = qsCode.toUpperCase(); me.pid = null; me.resumeToken = null; save();
  }
  // Legacy pid-only sessions cannot be trusted. Rejoin as a new lobby player.
  if (me.pid && !me.resumeToken) clearSession();

  /* ---------- Socket ---------- */
  const sock = FF.socket({
    open() {
      $('#net').hidden = true;
      if (me.code && me.pid && me.resumeToken) sock.send({ t: 'join', code: me.code, pid: me.pid, resumeToken: me.resumeToken, name: me.name });
      else if (!joined) render();
    },
    close() { $('#net').hidden = false; },
    message(m) {
      switch (m.t) {
        case 'joined':
          if (!joined) FF.sfx('join', {volume:0.25});
          joined = true; me.pid = m.pid; me.code = m.code; me.name = m.name; if (m.resumeToken) me.resumeToken = m.resumeToken; save();
          wakeLock(); sendPending();
          break;
        case 'error':
          if (['noroom', 'started', 'resume_denied'].includes(m.code)) { clearSession(); joined = false; S = null; key = ''; render(); }
          if (['drawing_invalid','drawing_size','drawing_id'].includes(m.code)) {
            pendingDrawing = null; keepPending(); key = ''; render();
          }
          showError(m.msg);
          break;
        case 'state': onState(m); break;
        case 'lots':
          lotList = m.lots; lotsRound = m.round;
          lots = Object.fromEntries(m.lots.map(l => [l.letter, l]));
          key = ''; if (S) render();
          break;
        case 'drawing_received':
          if (pendingDrawing && pendingDrawing.round === m.round && pendingDrawing.submissionId === m.submissionId) {
            pendingDrawing = null; keepPending(); FF.sfx('submit', {volume:0.25});
            try { sessionStorage.removeItem(draftKey()); } catch { /* ignore */ }
          }
          break;
        case 'bid_accepted': FF.sfx('bid', {volume:0.25}); toast(`Bid accepted: ${m.amount * 100} guineas on Lot ${m.lot}.`); break;
        case 'pass_accepted': toast('Pass accepted. You may still admire a painting.'); break;
        case 'toast': toast(m.msg); break;
      }
    },
  });

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function showError(msg) { const e = $('#joinErr'); if (e) e.textContent = msg; else toast(msg); }
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* ignore */ } }

  let lock = null;
  async function wakeLock() {
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch { /* ignore */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joined) wakeLock(); });

  /* ---------- State ---------- */
  function onState(s) {
    S = s;
    FF.setTimeLeft(s.timeLeft);
    document.body.classList.toggle('after', s.settings.deck === 'adult');
    document.body.dataset.phase = s.phase;
    if (s.phase !== lastPhase) { buzz(40); lastPhase = s.phase; FF.music(s.phase, 0.12); }
    if (pendingDrawing && (s.phase !== 'draw' || pendingDrawing.round !== s.round || (s.you && s.you.submitted))) {
      pendingDrawing = null; keepPending();
    }
    sendPending();
    if (auc.round !== s.round) { auc.round = s.round; auc.sel = null; auc.amount = 2; auc.heart = null; }
    render();
  }

  function keyFor() {
    if (!S || !joined) return 'join';
    const y = S.you, r = S.round, ready = lotsRound === r;
    switch (S.phase) {
      case 'lobby': return 'lobby:' + JSON.stringify([S.settings, S.adultConfirmed, y.isVip, y.avatar, S.players.length, S.players.filter(p => p.connected).length]);
      case 'draw': return y.submitted
        ? `drawn:${r}:${S.players.filter(p => p.connected && !p.submitted).length}:${y.isVip}`
        : `draw:${r}:${y.isVip}`;
      case 'auction': return y.isMaster ? `amaster:${r}:${ready}:${y.isVip}`
        : y.bid ? `abid:${r}:${S.players.filter(p => p.connected && p.id !== S.masterId && !p.bid).length}:${y.isVip}`
        : `auction:${r}:${ready}:${y.isVip}`;
      case 'final': return 'final:' + y.isVip;
      default: return `${S.phase}:${r}:${y.isVip}`;
    }
  }

  function render() {
    document.body.classList.toggle('join-view', !S || !joined);
    const k = keyFor();
    if (k === key) { tickUpdate(); return; }
    key = k;
    if (!S || !joined) return joinScreen();
    ({ lobby, intro, draw, auction, reveal, scores, final, void: voided }[S.phase] || waiting)();
    tickUpdate();
  }

  const isVip = () => S && S.you && S.you.isVip;
  const playerById = id => (S.players.find(p => p.id === id) || { name: 'Someone', avatar: 8 });
  const cmd = c => sock.send({ t: 'cmd', cmd: c });

  function barHTML(roleText, master) {
    const y = S.you;
    return `<div class="bar"><span class="me">${FF.avatar(y.avatar, y.name)}<span>${esc(y.name)}</span></span>
      ${roleText ? `<span class="role ${master ? 'master' : ''}">${roleText}</span>` : ''}
      <span class="clock" data-clock></span></div>`;
  }

  /* ---------- Join ---------- */
  function joinScreen() {
    app.innerHTML = `<div class="body join-screen" style="justify-content:center">
      <p class="join-overline">THE PRIVATE GALLERY · EST. 1888</p>
      <div class="brand"><img src="/assets/logo.png" alt="Forgers Finger" onload="this.parentNode.classList.add('img-ok')" onerror="this.remove()"><span class="brand-text">Forgers Finger</span></div>
      <h1 class="join-headline">Your invitation <em>awaits</em></h1>
      <p class="lead join-lead" style="text-align:center">One genuine masterpiece. A gallery full of suspicious imitations.</p>
      <div class="join-figure"><img src="/assets/auctioneer.png" alt="Lord Gavelby, your auctioneer"><p>“Leave your morals at the door, and keep an eye on your guineas.”</p></div>
      <div class="field"><label for="code">Gallery code (on the TV)</label>
        <input id="code" class="code-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(me.code || '')}"></div>
      <div class="field"><label for="name">Your name</label>
        <input id="name" maxlength="12" autocomplete="nickname" value="${esc(me.name || '')}"></div>
      <p class="err" id="joinErr"></p>
    </div>
    <div class="foot"><button class="btn" id="joinBtn">Enter the Gallery</button>
      <a class="join-tv-link" href="/tv">Hosting the game? Open the TV gallery</a></div>`;

  /* ---------- Intro ---------- */

  /* ---------- Draw ---------- */
  const pad = { strokes: [], cur: null, color: 1, size: 1, active: null, total: 0, round: -1, armed: false };

  function draw() { if (S.you.submitted) drawn(); else paintScreen(); }

      <div class="tools">

          aria-label="${FF.PALETTE_NAMES[i]}" aria-pressed="${i === pad.color}">${i === 0 ? 'Rubber' : ''}</button>`).join('')}</div>
        <div class="row">
          <div class="sizes">${FF.SIZES.map((sz, i) => `<button class="tool" data-size="${i}" aria-label="${FF.SIZE_NAMES[i]} brush" aria-pressed="${i === pad.size}">

    $('#drawHelp').addEventListener('click', FF.showRules);
    setupCanvas();
    app.querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
      pad.color = Number(b.dataset.col);
      app.querySelectorAll('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b));
    }));
    app.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      pad.size = Number(b.dataset.size);
      app.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
    }));
    $('#undo').addEventListener('click', () => { const s = pad.strokes.pop(); if (s && s.p) pad.total -= s.p.length; repaint(); saveDraft(); });
    $('#wash').addEventListener('click', () => { pad.strokes.push({ f: pad.color }); repaint(); saveDraft(); });
    $('#clear').addEventListener('click', e => {
      const b = e.currentTarget;
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Sure?'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Clear'; }, 2500); return; }
      pad.strokes = []; pad.total = 0; repaint(); saveDraft(); delete b.dataset.sure; b.textContent = 'Clear';
    });
    $('#submit').addEventListener('click', submitDrawing);
    const h = $('#hurry'); if (h) h.addEventListener('click', () => cmd('skip'));
  }

  function setupCanvas() {
    const easel = $('#easel'), box = $('#box'), cv = $('#cv');
    const size = () => {
      const w = Math.min(easel.clientWidth - 16, (easel.clientHeight - 16) * 0.75);
      box.style.width = Math.max(120, Math.floor(w)) + 'px';
      box.style.height = Math.max(160, Math.floor(w / 0.75)) + 'px';
      repaint();
    };
    requestAnimationFrame(size);
    window.onresize = () => { if ($('#cv')) size(); };

    const pt = e => {
      const r = cv.getBoundingClientRect();
      const x = Math.round((e.clientX - r.left) / r.width * 1000), y = Math.round((e.clientY - r.top) / r.height * 1000);
      return [Math.max(0, Math.min(1000, x)), Math.max(0, Math.min(1000, y))];
    };
    const ctx = () => cv.getContext('2d');
    const seg = (s, x0, y0, x1, y1) => {
      const c = ctx(), W = cv.width, H = cv.height;
      c.strokeStyle = FF.PALETTE[s.c]; c.lineWidth = Math.max(1, FF.SIZES[s.w] * W / 1000); c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(x0 * W / 1000, y0 * H / 1000); c.lineTo(x1 * W / 1000, y1 * H / 1000); c.stroke();
    };
    cv.addEventListener('pointerdown', e => {
      if (pad.active !== null || S.phase !== 'draw' || S.you.submitted) return;
      if (pad.total > 56000) { toast('This canvas is full. Time to sign it.'); return; }
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      pad.active = e.pointerId;
      const [x, y] = pt(e);
      pad.cur = { c: pad.color, w: pad.size, p: [x, y] };
      pad.strokes.push(pad.cur);
      pad.total += 2;
      seg(pad.cur, x, y, x, y);
    });
    cv.addEventListener('pointermove', e => {
      if (e.pointerId !== pad.active || !pad.cur) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (evs.length ? evs : [e])) {
        const [x, y] = pt(ev);
        const p = pad.cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
        if (Math.abs(x - lx) + Math.abs(y - ly) < 4) continue;
        if (p.length >= 3996) { pad.cur = { c: pad.cur.c, w: pad.cur.w, p: [lx, ly] }; pad.strokes.push(pad.cur); pad.total += 2; }
        pad.cur.p.push(x, y); pad.total += 2;
        seg(pad.cur, lx, ly, x, y);
      }
    });
    const end = e => {
      if (e.pointerId !== pad.active) return;
      pad.active = null; pad.cur = null;
      repaint(); saveDraft();
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
  }
  function repaint() { const cv = $('#cv'); if (cv) FF.paint(cv, pad.strokes); }
  function saveDraft() { try { sessionStorage.setItem(draftKey(), JSON.stringify(pad.strokes)); } catch { /* full: ignore */ } }

  function submitDrawing() {
    if (!S || S.phase !== 'draw' || S.you.submitted || pendingDrawing) return;
    if (JSON.stringify(pad.strokes).length > 210000) { toast('Painting is too detailed. Undo some strokes before signing.'); return; }
    pendingDrawing = { round: S.round, submissionId: (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()), strokes: pad.strokes.slice() };
    keepPending();
    sendPending();
    const b = $('#submit'); if (b) { b.disabled = true; b.textContent = 'Signing…'; }
    buzz(60);
  }

      app.querySelectorAll('[data-heart]').forEach(h => h.setAttribute('aria-pressed', h.dataset.heart === auc.heart));

    };

      c.addEventListener('click', e => { if (e.target.closest('[data-heart]')) return; pickLot(); });

    app.querySelectorAll('[data-heart]').forEach(h => h.addEventListener('click', e => {

  function auctionMaster() {

  function scores() {

    const NAMES = { forger: 'Master Forger', gullible: 'Most Generous Collector', favourite: 'People’s Favourite', eagle: 'Eagle Eye' };
    const mine = f.awards.filter(a => a.id === S.you.id).map(a => NAMES[a.key]);
    app.innerHTML = `${barHTML('Final results')}

        <p class="big-num">${rank ? (tied ? 'Joint ' : '') + ordinal(rank) : '–'}</p>
        <p class="lead">${FF.money(S.you.score)}</p>
        ${mine.length ? `<p>${mine.map(n => `<span class="pill">${n}</span>`).join(' ')}</p>` : ''}
        <p class="small">The TV is showing tonight’s genuine masterpieces.</p>
      </div>
      ${isVip() ? `<div class="foot"><button class="btn" id="again">Back to the lobby</button></div>` : ''}`;
    const a = $('#again'); if (a) a.addEventListener('click', () => cmd('next'));
  }

  function waiting() { app.innerHTML = `<div class="body center" style="display:flex"><h2>One moment…</h2></div>`; }

  function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }


  /* ---------- Clock ---------- */
  function tickUpdate() {
    const sec = FF.secondsLeft();
    document.querySelectorAll('[data-clock]').forEach(el => {
      const show = S && ['draw', 'auction'].includes(S.phase);
      el.textContent = show ? sec : '';
      el.classList.toggle('low', show && sec <= 10);
    });
    document.querySelectorAll('[data-secs]').forEach(el => { el.textContent = sec; });
    document.querySelectorAll('[data-auction-warning]').forEach(el => {
      el.textContent = S && S.phase === 'auction' && sec <= 10 ? 'Final 10 seconds — seal your bid or pass!' : '';
      el.classList.toggle('urgent', S && S.phase === 'auction' && sec <= 10);
    });
    if (S && S.phase === 'auction' && sec === 0) {
      ['bidBtn', 'passBtn'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = true; });
    }
  }
  setInterval(() => {
    if (!S) return;
    tickUpdate();
    // Auto-submit whatever is on the canvas when time runs out
    if (S.phase === 'draw' && S.you && !S.you.submitted && !pendingDrawing && FF.deadline && Date.now() >= FF.deadline) submitDrawing();
  }, 250);

  render();
})();
</script>
</body>
</html>
